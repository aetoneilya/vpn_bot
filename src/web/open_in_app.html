<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Открыть в Happ</title>
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #000; --hint: #8e8e93; --accent: #2481cc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #fff; --hint: #8e8e93; --accent: #5aa7ec; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--hint); margin: 0 0 20px; }
  .button {
    display: block; padding: 15px 16px; border-radius: 12px; background: var(--accent); color: #fff;
    font-weight: 600; text-decoration: none;
  }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 24px; text-align: left; }
  .card b { font-size: 13px; color: var(--hint); font-weight: 500; }
  .url { font: 13px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; user-select: all; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Открываем Happ…</h1>
  <p>Если приложение не открылось само, нажми кнопку. Happ должен быть установлен.</p>
  <a class="button" href="{{DEEPLINK_HTML}}">Открыть в Happ</a>
  <div class="card">
    <b>Или скопируй ссылку и добавь её в приложении вручную</b>
    <div class="url">{{URL_HTML}}</div>
  </div>
</main>
<script>
  // Browsers ask for confirmation before switching apps; a direct navigation triggers it.
  window.location.href = {{DEEPLINK_JSON}};
</script>
</body>
</html>
